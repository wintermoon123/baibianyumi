<!DOCTYPE html>
<!--
  图片来源（均为真实实拍照片，来自 Pexels，遵循 Pexels License：可免费商用、可修改、无需署名）
    img/story-1.jpg  农户手持玉米      https://www.pexels.com/photo/3307282/
    img/story-2.jpg  编织篮            https://www.pexels.com/photo/24811442/
    img/story-3.jpg  彩色观赏玉米      https://www.pexels.com/photo/1527005/
    img/prod-1.jpg   观赏玉米（文玩）  https://www.pexels.com/photo/33853176/
    img/prod-2.jpg   手工编织篮        https://www.pexels.com/photo/28617395/
    img/prod-3.jpg   糙米              https://www.pexels.com/photo/8108115/
    img/prod-4.jpg   贴纸              https://www.pexels.com/photo/12413393/
  替换成正式素材时，只要覆盖 img/ 下同名文件即可，无需改代码。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>百变玉米</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#228B22; --forest-dark:#1B5E20; --forest-soft:#3F7A33;
  --earth:#8B4513; --earth-soft:#A9682F;
  --sky:#87CEEB; --sky-soft:#A9DCEF;
  --cream:#F5F5DC; --cream-2:#FBFAF2;
  --ink:#2B3A2B; --muted:#6B756B; --line:#E7ECDD;
  --card:#FFFFFF; --shadow:0 8px 24px rgba(34,139,34,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(135,206,235,.20), transparent 60%),
    radial-gradient(1000px 500px at -10% 10%, rgba(34,139,34,.14), transparent 55%),
    #EDEDE3;
}
/* 手机外框 */
.phone{
  max-width:390px;margin:22px auto;background:var(--cream-2);
  border-radius:34px;overflow:hidden;box-shadow:0 24px 60px rgba(30,60,30,.22);
  display:flex;flex-direction:column;height:calc(100vh - 44px);
  position:relative;border:1px solid #E2E2D6;
}
@media(max-width:480px){ .phone{margin:0;border-radius:0;height:100vh;border:none} }
.topbar{
  display:flex;align-items:center;gap:9px;padding:14px 18px 10px;
  background:linear-gradient(180deg, #fff, #FCFBF4);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;color:var(--forest-dark);letter-spacing:.5px}
.brand svg{width:24px;height:24px;color:var(--forest);flex:0 0 auto}
.demo-tag{margin-left:auto;font-size:11px;color:#fff;background:var(--forest-soft);padding:3px 9px;border-radius:99px;font-weight:500}
.views{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--forest-dark);margin:4px 2px 12px;display:flex;align-items:center;gap:8px}
h2.sec small{font-size:12px;color:var(--muted);font-weight:400;font-family:"Noto Sans SC",sans-serif}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
/* 百变玉米入口 */
.hero-corn{position:relative;border-radius:20px;overflow:hidden;padding:18px;color:#fff;box-shadow:var(--shadow);
  background:linear-gradient(135deg,var(--forest),var(--forest-dark));cursor:pointer}
.hero-corn .row{display:flex;align-items:center;gap:14px}
.hero-corn img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.hero-corn h3{margin:0;font-family:"Noto Serif SC",serif;font-size:19px}
.hero-corn p{margin:4px 0 0;font-size:12.5px;opacity:.9}
.hero-corn .arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.8}
.block-title{font-size:14px;font-weight:700;color:var(--ink);margin:22px 4px 10px;display:flex;align-items:center;gap:6px}
.block-title svg{width:17px;height:17px;color:var(--forest-soft)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}
.vstack{display:flex;flex-direction:column;gap:12px;padding:2px 2px 4px}
.story{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#fff;border:1px solid var(--line)}
.vstack .story{display:flex;flex-direction:column}
.story .ph{height:140px;background-size:cover;background-position:center}
.story .body{padding:10px 12px 13px}
.story .body h4{margin:0 0 4px;font-size:14px}
.story .body p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.story .tag{display:inline-block;font-size:10.5px;color:var(--forest);background:rgba(34,139,34,.1);border-radius:99px;padding:2px 8px;margin-bottom:6px}
.story .body .src-link{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--forest);text-decoration:none;border-bottom:1.5px solid var(--forest)}
.story .body .src-link:hover{opacity:.75}
.ez{display:grid;grid-template-columns:1fr;gap:12px}
.ez .item{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.ez .item h4{margin:0 0 5px;font-size:13.5px;color:var(--forest-dark)}
.ez .item p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.evt{display:flex;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px}
.evt .date{flex:0 0 50px;text-align:center;color:var(--forest-dark);font-weight:700;font-family:"Noto Serif SC",serif}
.evt .date small{display:block;font-size:10px;color:var(--muted);font-weight:400;font-family:"Noto Sans SC"}
.evt .info h4{margin:0 0 3px;font-size:14px}
.evt .info p{margin:0;font-size:12px;color:var(--muted)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.prod .ph{height:96px;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:space-between;padding:8px}
.prod .ph .price{background:#fff;color:var(--earth);font-weight:700;font-size:12px;border-radius:99px;padding:2px 9px}
.prod .ph .kind{background:rgba(27,94,32,.85);color:#fff;font-size:10.5px;border-radius:99px;padding:2px 8px}
.prod .body{padding:10px 11px 12px}
.prod .body h4{margin:0 0 6px;font-size:13.5px}
.btn{border:none;font-family:inherit;cursor:pointer;border-radius:99px;font-weight:700;font-size:13px;padding:8px 14px;background:var(--forest);color:#fff;box-shadow:0 4px 12px rgba(34,139,34,.28);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--forest-dark);border:1px solid var(--forest-soft)}
.btn.block{width:100%}
.game-lock{border:1.5px dashed var(--forest-soft);background:rgba(34,139,34,.05);border-radius:16px;padding:22px;text-align:center;color:var(--forest-soft)}
.game-lock svg{width:34px;height:34px;opacity:.7}
.game-lock p{margin:8px 0 0;font-size:13px}
/* 每日一题 */
.quiz{padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.quiz .cat{display:inline-block;font-size:11px;color:#fff;background:var(--sky-soft);color:var(--forest-dark);border-radius:99px;padding:3px 10px;font-weight:600}
.quiz h3{margin:10px 0 14px;font-size:17px;line-height:1.45}
.opt{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
.opt:hover{border-color:var(--forest-soft)}
.opt.sel{border-color:var(--forest);background:rgba(34,139,34,.06)}
.opt .dot{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:2px solid #C9D3BE;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.opt.correct{border-color:var(--forest);background:rgba(34,139,34,.10)}
.opt.correct .dot{background:var(--forest);border-color:var(--forest)}
.opt.dim{opacity:.55}
.feedback{margin-top:6px;padding:12px 14px;border-radius:14px;background:rgba(135,206,235,.14);font-size:13px;line-height:1.55}
.feedback b{color:var(--forest-dark)}
.feedback .src{display:block;margin-top:6px;color:var(--muted);font-size:11.5px}
.qfoot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.done-box{text-align:center;padding:26px 18px}
.done-box .big{font-family:"Noto Serif SC",serif;font-size:22px;color:var(--forest-dark)}
.done-box p{color:var(--muted);font-size:13px;margin:8px 0 16px}
/* 点子市集 */
.persp{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.persp button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer;font-family:inherit}
.persp button.on{background:var(--earth);color:#fff;border-color:var(--earth)}
.idea{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:11px}
.idea .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.idea .ptag{font-size:10.5px;background:rgba(139,69,19,.12);color:var(--earth);border-radius:99px;padding:2px 9px;font-weight:600}
.idea h4{margin:0;font-size:14.5px;color:var(--forest-dark)}
.idea p{margin:0 0 7px;font-size:12.5px;color:var(--muted);line-height:1.55}
.idea .owner{font-size:11px;color:var(--forest-soft)}
.tip{padding:14px;border-radius:16px;background:linear-gradient(135deg,#FBFAF2,#F0F4E6);border:1px solid var(--line);margin-bottom:11px}
.tip h4{margin:0 0 5px;font-size:13.5px;color:var(--forest-dark);display:flex;align-items:center;gap:6px}
.tip p{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
.flow{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow);margin-top:6px}
.flow h4{margin:0 0 10px;font-size:14px;color:var(--forest-dark)}
.flow .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .step{background:rgba(34,139,34,.08);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--forest-dark)}
.flow .arr{color:var(--muted);font-size:13px}
.flow p.note{margin:11px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
/* 我的 */
.profile-head{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:linear-gradient(135deg,#fff,#F3F7EA);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.avatar{width:66px;height:66px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(34,139,34,.2);background:var(--cream);flex:0 0 66px}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-head .nm{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:700;color:var(--forest-dark)}
.profile-head .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:700;color:var(--forest)}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.rec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 13px;box-shadow:var(--shadow);margin-bottom:11px}
.rec .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.rec .row:last-child{border-bottom:none}
.rec .ok{width:18px;height:18px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 18px}
.rec .no{background:#C0392B}
.rec .q{flex:1;color:var(--ink)}
.rec .d{color:var(--muted);font-size:11px}
.rec .pt{color:var(--earth);font-weight:700}
.rec .row.click{cursor:pointer}
.rec .row.click:active{background:rgba(34,139,34,.06)}
.rec-detail-q{font-size:14.5px;font-weight:600;color:var(--forest-dark);line-height:1.5;margin:2px 0 14px}
.rec-opt{padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.rec-opt b{color:var(--muted);min-width:14px}
.rec-opt.correct{background:rgba(34,139,34,.1);border-color:var(--forest)}
.rec-opt.correct b{color:var(--forest-dark)}
.rec-opt.wrong{background:rgba(192,57,43,.1);border-color:#C0392B}
.rec-opt.wrong b{color:#C0392B}
.rec-src{font-size:12px;color:var(--muted);background:rgba(34,139,34,.06);border-radius:12px;padding:10px 12px;margin-top:6px;line-height:1.6}
.rec-meta{font-size:12px;color:var(--ink);margin:12px 0 0}
.own-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
.own-card:active{transform:scale(.98)}
.own-card .thumb{width:54px;height:72px;border-radius:10px;flex:0 0 54px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.own-card .thumb svg{width:100%;height:100%;display:block}
.own-card .view-hint{margin-left:auto;font-size:12px;color:var(--forest);white-space:nowrap}
.corn-entries{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
.corn-entry{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:center}
.corn-entry:active{transform:scale(.98)}
.corn-entry svg{width:30px;height:30px;color:var(--forest)}
.corn-entry span{font-size:13px;font-weight:600;color:var(--forest-dark)}
.own-card .info h4{margin:0 0 3px;font-size:14px;color:var(--forest-dark)}
.own-card .info p{margin:0;font-size:11.5px;color:var(--muted)}
.fan{text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:11px}
.fan .qr{width:120px;height:120px;margin:6px auto 8px;background:#fff;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.fan .qr svg{width:108px;height:108px}
.fan p{margin:0;font-size:12px;color:var(--muted)}
/* 底部导航 */
.tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:none;cursor:pointer;color:var(--muted);font-family:inherit;font-size:11px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--forest)}
.tab.on svg{color:var(--forest)}
/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(20,30,20,.5);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.mask.show{display:flex}
.sheet{background:#fff;border-radius:22px;max-width:360px;width:100%;max-height:88%;overflow-y:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 12px;font-family:"Noto Serif SC",serif;font-size:18px;color:var(--forest-dark);display:flex;align-items:center;justify-content:space-between}
.sheet .x{font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.bigcard{width:222px;margin:0 auto 14px;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(40,60,40,.18)}
.bigcard svg{display:block;width:100%;height:auto}
.share-canvas{width:100%;border-radius:16px;display:block;border:1px solid var(--line)}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(27,60,27,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.foot-note{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="phone">

        buffer.put(PAD0, 8);

      img += '\u0020height="';

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

const todayStr=()=>new Date().toISOString().slice(0,10);
let curQ=null;
function pickQuestion(){
  const pool=QB.filter(x=>!U.answered.includes(QB.indexOf(x)));
  if(pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function optStatusHTML(q, chosenIdx){
  return q.o.map((o,i)=>{
    let cls='opt';
    if(i===q.a)cls+=' correct';
    else cls+=' dim';
    return `<div class="${cls}"><span class="dot">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`;
  }).join('');
}
function renderQuiz(){
  const wrap=document.getElementById('quizWrap');
  if(U.lastAnswerDate===todayStr()){
    const last=U.history[U.history.length-1];
    const q=QB[last.qid];
    wrap.innerHTML=`<div class="quiz">
      <span class="cat">${q.cat}</span>
      <h3>${q.q}</h3>
      <div id="opts">${optStatusHTML(q, last.cain)}</div>
      <div class="feedback"><b>${last.correct?'你答对啦，+5 积分':'正确答案'}</b>：${q.o[q.a]}<span class="src">信息来源：${q.src}</span></div>
      <button class="btn ghost block" style="margin-top:14px" onclick="openShare()">分享</button>
      <p class="qfoot">今日已答 ✓ · 明天再来挑战新题</p>
    </div>`;
    return;
  }
  curQ=pickQuestion();
  if(!curQ){wrap.innerHTML=`<div class="quiz"><div class="done-box"><div class="big">题库已答完 🌽</div><p>所有题目都挑战过啦，感谢参与！</p></div></div>`;return;}
  const qi=QB.indexOf(curQ);
  wrap.innerHTML=`<div class="quiz">
    <span class="cat">${curQ.cat}</span>
    <h3>${curQ.q}</h3>
    <div id="opts">${curQ.o.map((o,i)=>`<div class="opt" onclick="choose(${i})"><span class="dot">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join('')}</div>
    <button class="btn block" id="submitBtn" disabled style="opacity:.5;margin-top:4px" onclick="submit()">提交答案</button>
  </div>`;
}
let chosen=-1;
function choose(i){
  if(U.lastAnswerDate===todayStr())return;
  chosen=i;
  document.querySelectorAll('#opts .opt').forEach((el,idx)=>el.classList.toggle('sel',idx===i));
  const b=document.getElementById('submitBtn');b.disabled=false;b.style.opacity=1;
}
function submit(){
  if(chosen<0||!curQ)return;
  const qi=QB.indexOf(curQ), correct=chosen===curQ.a, gain=correct?5:0;
  U.answered.push(qi);
  if(correct)U.points+=gain;
  U.lastAnswerDate=todayStr();
  U.history.push({qid:qi,q:curQ.q,correct,cain:chosen,gain,date:todayStr()});
  save();
  const opts=document.querySelectorAll('#opts .opt');
  opts.forEach((el,idx)=>{
    el.classList.remove('sel');
    if(idx===curQ.a)el.classList.add('correct');
    else el.classList.add('dim');
  });
  document.getElementById('submitBtn').outerHTML=`<div class="feedback"><b>${correct?'答对啦 +5 积分':'正确答案'}</b>：${curQ.o[curQ.a]}<span class="src">信息来源：${curQ.src}</span></div><button class="btn ghost block" style="margin-top:14px" onclick="openShare()">分享</button><p class="qfoot">今日已答 ✓ · 明天再来挑战新题</p>`;
  renderMe();
}

/* ============ 分享卡（canvas + 二维码） ============ */
let shareData=null;
function openShare(){
  const last=U.history[U.history.length-1];
  if(!last){toast('请先完成今日一题');return;}
  const q=QB[last.qid];
  shareData={qid:last.qid,q:q.q,a:q.o[q.a],src:q.src,correct:last.correct};
  drawShare();
  document.getElementById('shareMask').classList.add('show');
}
function closeShare(){document.getElementById('shareMask').classList.remove('show');}
function drawShare(){
  const cv=document.getElementById('shareCv'),ctx=cv.getContext('2d');
  const W=720;
  const cardX=40,cardY=44,cardW=W-80,padX=cardX+44;
  const q=QB[shareData.qid];
  const letters=['A','B','C','D'];
  const now=new Date();
  const dateStr=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

  // 预测量内容高度（须先设对应字体）
  ctx.font='700 23px "Noto Sans SC",sans-serif';
  const qLines=Math.max(1,measureCN(ctx,shareData.q,cardW-88));
  ctx.font='400 19px "Noto Sans SC",sans-serif';
  let optH=0;
  for(let i=0;i<q.o.length;i++){
    const ol=Math.max(1,measureCN(ctx,q.o[i],cardW-104));
    optH+=Math.max(34,ol*26+12);
  }
  const srcText='信息来源：'+shareData.src;
  ctx.font='400 15px "Noto Sans SC",sans-serif';
  const sLines=Math.max(1,measureCN(ctx,srcText,cardW-88));

  const topPad=232, gapAfterQ=24, gapToSrc=8, bottomPad=22, minCardH=660;
  let contentH=qLines*34+gapAfterQ+optH+gapToSrc+sLines*22;
  let cardH=topPad+contentH+bottomPad, extra=0;
  if(cardH<minCardH){extra=minCardH-cardH;cardH=minCardH;}
  const dy=extra/3;
  const qStart=cardY+topPad+dy, gAfterQ=gapAfterQ+dy, gToSrc=gapToSrc+dy;
  const cardBottom=cardY+cardH;

  // 画布：长4宽3（720×960）；内容超长时自动增高
  const qz=150, qrBlock=198;
  let H=Math.max(960,cardBottom+16+qrBlock);
  cv.width=W;cv.height=Math.round(H);
  const qrTop=H-qrBlock;

  // 背景
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#F3F7EA');g.addColorStop(1,'#E6F0D8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 有机圆斑
  ctx.fillStyle='rgba(34,139,34,.10)';circle(ctx,W*0.85,H*0.1,110);
  ctx.fillStyle='rgba(135,206,235,.18)';circle(ctx,W*0.08,H*0.9,140);
  ctx.fillStyle='rgba(139,69,19,.07)';circle(ctx,W*0.92,H*0.88,80);

  // 卡片底
  roundRect(ctx,cardX,cardY,cardW,cardH,26);ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.strokeStyle='#E7ECDD';ctx.lineWidth=2;ctx.stroke();

  // 标题区（瑞幸风：大日期为视觉锚点）
  ctx.textAlign='center';
  ctx.fillStyle='#1B5E20';ctx.font='700 34px "Noto Serif SC",serif';
  ctx.fillText('百变玉米',W/2,cardY+58);
  ctx.fillStyle='#6B756B';ctx.font='400 17px "Noto Sans SC",sans-serif';
  ctx.fillText('每日一题，离可持续更近一点',W/2,cardY+90);
  ctx.fillStyle='#228B22';ctx.font='700 54px "Noto Serif SC",serif';
  ctx.fillText(dateStr,W/2,cardY+162);

  // 题目
  ctx.textAlign='left';
  ctx.fillStyle='#2B3A2B';ctx.font='700 23px "Noto Sans SC",sans-serif';
  wrapText(ctx,shareData.q,padX,qStart,cardW-88,34);

  // 选项（不区分对错，统一样式）
  let oy=qStart+qLines*34+gAfterQ;
  for(let i=0;i<q.o.length;i++){
    ctx.beginPath();ctx.arc(padX+14,oy+12,14,0,Math.PI*2);
    ctx.fillStyle='#EDEFE8';ctx.fill();
    ctx.fillStyle='#8A938A';ctx.font='700 16px "Noto Sans SC",sans-serif';
    ctx.textAlign='center';ctx.fillText(letters[i],padX+14,oy+17);
    ctx.textAlign='left';
    ctx.fillStyle='#5A635A';ctx.font='400 19px "Noto Sans SC",sans-serif';
    const lines=wrapLines(ctx,q.o[i],padX+40,oy+17,cardW-104,26);
    oy+=Math.max(34,lines*26+12);
  }
  // 来源
  ctx.fillStyle='#9AA39A';ctx.font='400 15px "Noto Sans SC",sans-serif';
  wrapText(ctx,srcText,padX,oy+gToSrc,cardW-88,22);

  // 二维码（固定于底部）
  try{
    const qr=qrcode(0,'M');qr.addData('https://wintermoon123.github.io/baibianyumi/');qr.make();
    const url=qr.createDataURL(6,8);
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,(W-qz)/2,qrTop,qz,qz);
      ctx.fillStyle='#6B756B';ctx.font='400 18px "Noto Sans SC",sans-serif';ctx.textAlign='center';
      ctx.fillText('扫码来答每日一题',W/2,qrTop+qz+26);
    };
    img.src=url;
  }catch(e){}
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function wrapText(ctx,text,x,y,maxW,lh){
  let line='',yy=y;
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  ctx.fillText(line,x,yy);return yy;
}
function wrapLines(ctx,text,x,y,maxW,lh){
  let line='',yy=y,n=0;
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;n++;}
    else line+=ch;
  }
  ctx.fillText(line,x,yy);n++;return n;
}
function measureCN(ctx,text,maxW){let n=1,line='';for(const ch of text){if(ctx.measureText(line+ch).width>maxW){n++;line=ch;}else line+=ch;}return n;}
function downloadShare(){const cv=document.getElementById('shareCv');const a=document.createElement('a');a.download='循塑100_每日一题.png';a.href=cv.toDataURL('image/png');a.click();toast('已保存（演示）');}

      <div style="font-size:12px;color:var(--muted)">类型：${kind}</div>

    <p style="font-size:12.5px;color:var(--muted);line-height:1.6;background:rgba(135,206,235,.12);border-radius:12px;padding:11px">正式版将跳转微店 / 企业微信人工客服完成购买。Demo 仅作流程演示。</p>
    <button class="btn block" onclick="mockBuy()">模拟下单</button>`;
  document.getElementById('buyMask').classList.add('show');
}
function mockBuy(){closeBuy();toast('已模拟下单（演示）');}
function closeBuy(){document.getElementById('buyMask').classList.remove('show');}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);}
function save(){localStorage.setItem(LS,JSON.stringify(U));}

/* ============ 导航 ============ */
function switchTab(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(el.dataset.v).classList.add('active');
  if(el.dataset.v==='v-quiz')renderQuiz();
  if(el.dataset.v==='v-me')renderMe();
}

/* ============ 初始化 ============ */
renderPlaza();
renderPersp();renderIdeas();
renderMe();
</script>
